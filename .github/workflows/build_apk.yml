name: Build & Release Zuno AI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Check Flutter Version & Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: |
          cd zuno_app
          flutter pub get

      - name: Build APK (Release & Split Per ABI)
        run: |
          cd zuno_app
          flutter build apk --release --split-per-abi

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zuno-ai-apk
          path: zuno_app/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: zuno_app/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
