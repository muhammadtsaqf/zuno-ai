<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E17" />
      <stop offset="100%" stop-color="#1B1A29" />
    </linearGradient>

    <!-- Glowing Cyber Metallic Outer Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Z Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="170" fill="#0F0E17" stroke="url(#ringGrad)" stroke-width="2" opacity="0.5" />

  <!-- Central "Z" Futuristic Emblem -->
  <path d="M 170 160 L 340 160 Q 360 160 350 180 L 210 330 L 340 330 Q 360 330 360 350 Q 360 370 340 370 L 170 370 Q 150 370 160 350 L 300 200 L 170 200 Q 150 200 150 180 Q 150 160 170 160 Z" 
        fill="url(#coreGrad)" filter="url(#neonGlow)" />

  <!-- Orbit Node 1 -->
  <circle cx="360" cy="160" r="16" fill="#00F5D4" filter="url(#neonGlow)" />
  <!-- Orbit Node 2 -->
  <circle cx="150" cy="350" r="12" fill="#FF007F" filter="url(#neonGlow)" />

  <!-- Tech Developer Badge -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#00F5D4" text-anchor="middle" letter-spacing="4">
    ZUNO AI
  </text>
</svg>
