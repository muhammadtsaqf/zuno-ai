<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1A103C"/>
      <stop offset="100%" stop-color="#05030A"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Neon Pink/Magenta Gradient -->
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>

    <!-- Cyber Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1B54" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#120924" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Cyber Hexagon Outer Border -->
  <polygon points="256,40 430,140 430,340 256,440 82,340 82,140" fill="url(#shieldGrad)" stroke="url(#cyanGlow)" stroke-width="6" filter="url(#glow)"/>

  <!-- Futuristic Z Logo Path -->
  <path d="M 150 160 L 360 160 L 190 340 L 362 340" fill="none" stroke="url(#pinkGlow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <path d="M 150 160 L 360 160 L 190 340 L 362 340" fill="none" stroke="url(#cyanGlow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Core Nodes / Glowing Orbs -->
  <circle cx="256" cy="250" r="16" fill="#00F2FE" filter="url(#glow)"/>
  <circle cx="360" cy="160" r="12" fill="#FF0844" filter="url(#glow)"/>
  <circle cx="150" cy="160" r="10" fill="#00F2FE"/>
  <circle cx="362" cy="340" r="10" fill="#00F2FE"/>
  <circle cx="190" cy="340" r="12" fill="#FF0844" filter="url(#glow)"/>

  <!-- Circuit Lines -->
  <line x1="256" y1="250" x2="360" y2="160" stroke="#00F2FE" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
  <line x1="256" y1="250" x2="190" y2="340" stroke="#FF0844" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
</svg>
