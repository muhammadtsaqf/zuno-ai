<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0819"/>
      <stop offset="40%" stop-color="#180E38"/>
      <stop offset="100%" stop-color="#030208"/>
    </linearGradient>

    <!-- Neon Cyan -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Neon Pink -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>

    <!-- Metallic Gold/Purple Accent -->
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#posterBg)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.1" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="950" cy="315" r="220" fill="url(#neonCyan)" opacity="0.15" filter="url(#heavyGlow)"/>
  <circle cx="200" cy="150" r="180" fill="url(#purpleGold)" opacity="0.12" filter="url(#heavyGlow)"/>

  <!-- Left Side: App Emblem Shield -->
  <g transform="translate(140, 140)">
    <polygon points="175,20 315,100 315,260 175,340 35,260 35,100" fill="#1A103C" stroke="url(#neonCyan)" stroke-width="6" filter="url(#heavyGlow)"/>
    <path d="M 90 110 L 260 110 L 125 250 L 260 250" fill="none" stroke="url(#neonPink)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#heavyGlow)"/>
    <path d="M 90 110 L 260 110 L 125 250 L 260 250" fill="none" stroke="url(#neonCyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Headline Text -->
  <text x="540" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    ZUNO <tspan fill="url(#neonCyan)">AI</tspan>
  </text>

  <text x="540" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="url(#neonPink)" letter-spacing="2">
    NEXT-GEN INTELLIGENT ASSISTANT
  </text>

  <text x="540" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#A0A5C0" width="550">
    Powered by Qwen Max 3.8, Gemini 3.6 Flash, &amp; Claude 4.6
  </text>
  <text x="540" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#A0A5C0">
    Secure Encrypted Cloud Session Sync &amp; Cyber Interface
  </text>

  <!-- Badge Badges -->
  <g transform="translate(540, 400)">
    <!-- Badge 1: Multi-Model -->
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#1A103C" stroke="url(#neonCyan)" stroke-width="2"/>
    <text x="80" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00F2FE" text-anchor="middle">⚡ Multi-Model</text>

    <!-- Badge 2: Auth Ready -->
    <rect x="180" y="0" width="160" height="42" rx="21" fill="#1A103C" stroke="url(#neonPink)" stroke-width="2"/>
    <text x="260" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FF0844" text-anchor="middle">🔒 Secure Auth</text>

    <!-- Badge 3: Cloud Proxy -->
    <rect x="360" y="0" width="160" height="42" rx="21" fill="#1A103C" stroke="url(#purpleGold)" stroke-width="2"/>
    <text x="440" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E100FF" text-anchor="middle">☁️ Cloud Core</text>
  </g>

  <!-- Footer Developer Credit -->
  <text x="540" y="520" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#6E759F">
    Created with ❤️ by <tspan fill="#00F2FE">zzamcode</tspan> (Muhammad Tsaqif Noor Az Zamil)
  </text>
</svg>
